<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paso 2 — Plataforma + enemigo (Workshop Mario)</title>
  <style>html, body { margin: 0; height: 100%; overflow: hidden; }</style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.7.0/aframe.min.js"></script>
  <!-- Componente del proyecto: enemigo que se mueve en un eje -->
  <script src="../src/js/enemy-movement.js"></script>
</head>
<body>
  <a-scene
    id="main-scene"
    background="color: #5C94FC"
    fog="type: linear; color: #7EB8FA; near: 25; far: 85"
  >
    <a-entity id="rig" position="0 1.6 4">
      <a-entity camera look-controls wasd-controls="acceleration: 15"></a-entity>
    </a-entity>

    <a-entity light="type: ambient; color: #FFF; intensity: 0.6"></a-entity>
    <a-entity
      light="type: directional; color: #FFF; intensity: 1; castShadow: true"
      position="5 18 8"
    ></a-entity>

    <a-plane
      id="ground"
      position="0 0 0"
      rotation="-90 0 0"
      width="30"
      height="30"
      color="#3D9B35"
      shadow="receive: true"
    ></a-plane>

    <!-- Paso 1: una plataforma -->
    <a-box
      id="platform-1"
      class="platform"
      position="0 0.5 -5"
      width="4"
      height="1"
      depth="2"
      color="#C68C53"
      shadow="cast: true; receive: true"
    ></a-box>

    <!-- Paso 2: un enemigo sobre la plataforma (se mueve en X, ida y vuelta) -->
    <a-entity
      id="enemy-1"
      class="enemy"
      position="0 1.2 -5"
      enemy-movement="range: 1; axis: x; speed: 0.5"
    >
      <a-box
        width="0.6"
        height="0.6"
        depth="0.6"
        color="#5D4037"
        shadow="cast: true"
      ></a-box>
    </a-entity>

    <a-sky color="#87CEEB"></a-sky>
  </a-scene>
</body>
</html>
