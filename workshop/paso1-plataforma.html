<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paso 1 — Una plataforma (Workshop Mario)</title>
  <style>html, body { margin: 0; height: 100%; overflow: hidden; }</style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.7.0/aframe.min.js"></script>
</head>
<body>
  <a-scene
    id="main-scene"
    background="color: #5C94FC"
    fog="type: linear; color: #7EB8FA; near: 25; far: 85"
  >
    <!-- Cámara con controles para mirar y moverte -->
    <a-entity id="rig" position="0 1.6 4">
      <a-entity camera look-controls wasd-controls="acceleration: 15"></a-entity>
    </a-entity>

    <!-- Luces -->
    <a-entity light="type: ambient; color: #FFF; intensity: 0.6"></a-entity>
    <a-entity
      light="type: directional; color: #FFF; intensity: 1; castShadow: true"
      position="5 18 8"
    ></a-entity>

    <!-- Suelo -->
    <a-plane
      id="ground"
      position="0 0 0"
      rotation="-90 0 0"
      width="30"
      height="30"
      color="#3D9B35"
      shadow="receive: true"
    ></a-plane>

    <!-- Paso 1: UNA plataforma (bloque tipo Mario) -->
    <a-box
      id="platform-1"
      class="platform"
      position="0 0.5 -5"
      width="4"
      height="1"
      depth="2"
      color="#C68C53"
      shadow="cast: true; receive: true"
    ></a-box>

    <a-sky color="#87CEEB"></a-sky>
  </a-scene>
</body>
</html>
