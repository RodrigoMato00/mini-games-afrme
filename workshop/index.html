<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Workshop A-Frame - Escena básica</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://threejs.org;"
    />

    <!-- A-Frame desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.7.0/aframe.min.js"></script>

    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #000;
      }

      .ui-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 16px;
        color: #f5f5f5;
        background: radial-gradient(circle at top, #111 0, transparent 60%);
      }

      .ui-card {
        pointer-events: auto;
        background: rgba(10, 10, 10, 0.75);
        border-radius: 12px;
        padding: 12px 16px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        max-width: 520px;
        width: 100%;
      }

      .ui-title {
        font-size: 18px;
        margin: 0 0 4px;
      }

      .ui-sub {
        font-size: 13px;
        opacity: 0.8;
        margin: 0 0 8px;
      }

      .ui-hint {
        font-size: 12px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <!-- UI superpuesta para el workshop -->
    <div class="ui-overlay">
      <div class="ui-card">
        <h1 class="ui-title">Workshop A‑Frame</h1>
        <p class="ui-sub">
          Escena básica: cámara, suelo, luz y primitivas 3D.
        </p>
        <p class="ui-hint">
          <strong>Nivel tipo Mario (paso a paso):</strong>
          <a href="GUIA_NIVEL1_MARIO.md" style="color: #7ec8e3;">Guía</a> ·
          <a href="paso1-plataforma.html" style="color: #7ec8e3;">Paso 1</a> Plataforma ·
          <a href="paso2-enemigo.html" style="color: #7ec8e3;">Paso 2</a> Enemigo ·
          <a href="paso3-moneda.html" style="color: #7ec8e3;">Paso 3</a> Moneda ·
          <a href="../nivel1.html" style="color: #7ec8e3;">Nivel 1 completo</a>
          <br />Tips: ratón para mirar, <strong>Ctrl + Alt + I</strong> para el inspector.
        </p>
      </div>
    </div>

    <!-- Escena básica A-Frame para el workshop -->
    <!-- Inspector: URL custom (doc oficial) para usar jsDelivr y respetar CSP sin unpkg -->
    <a-scene
      background="color: #20222b"
      inspector="url: https://cdn.jsdelivr.net/npm/aframe-inspector@1.7.0/dist/aframe-inspector.min.js"
    >
      <!-- Cámara con controles por defecto -->
      <a-entity
        id="rig"
        position="0 1.6 4"
      >
        <a-entity
          camera
          look-controls
          wasd-controls="acceleration: 15"
        ></a-entity>
      </a-entity>

      <!-- Luz ambiente suave -->
      <a-entity light="type: ambient; color: #555"></a-entity>

      <!-- Luz direccional principal -->
      <a-entity
        light="type: directional; color: #fff; intensity: 0.9"
        position="2 4 1"
      ></a-entity>

      <!-- Suelo -->
      <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="20"
        height="20"
        color="#3c4250"
      ></a-plane>

      <!-- Cubo central -->
      <a-box
        position="0 1 -3"
        depth="1"
        height="1"
        width="1"
        color="#ff6b6b"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
      ></a-box>

      <!-- Esfera -->
      <a-sphere
        position="-1.8 1.2 -2.5"
        radius="0.6"
        color="#4ecdc4"
        metalness="0.3"
        roughness="0.2"
      ></a-sphere>

      <!-- Cilindro -->
      <a-cylinder
        position="1.8 0.9 -2.5"
        radius="0.5"
        height="1.8"
        color="#ffe66d"
      ></a-cylinder>

      <!-- Cielo sencillo -->
      <a-sky color="#151824"></a-sky>
    </a-scene>
  </body>
  </html>
